<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
  <!-- square (the "print") -->
  <rect x="20" y="20" width="216" height="216" rx="16"/>
  <!-- corner ticks: blueprint registration marks -->
  <g stroke-width="5">
    <path d="M40 54 V40 H54"/>
    <path d="M202 40 H216 V54"/>
    <path d="M216 202 V216 H202"/>
    <path d="M54 216 H40 V202"/>
  </g>
  <!-- head -->
  <path d="M128 60
           C 92 60 70 86 70 122
           C 70 160 94 188 128 192
           C 162 188 186 160 186 122
           C 186 86 164 60 128 60 Z" stroke-width="6.5"/>
  <!-- ears -->
  <path d="M70 116 C 60 116 60 136 70 136" stroke-width="5"/>
  <path d="M186 116 C 196 116 196 136 186 136" stroke-width="5"/>
  <!-- brain mass (two lobes) -->
  <path d="M128 86
           C 150 78 168 92 163 112
           C 173 121 170 139 158 142
           C 155 155 137 159 129 150
           C 119 159 101 154 99 141
           C 87 137 86 119 97 111
           C 92 92 110 78 128 86 Z" stroke-width="6"/>
  <!-- central fissure (curved) -->
  <path d="M128 90 C 122 104 134 114 128 128 C 123 140 131 146 128 150" stroke-width="5"/>
  <!-- folds (gyri), staggered -->
  <g stroke-width="5">
    <path d="M118 100 Q 104 108 113 120"/>
    <path d="M114 128 Q 103 138 116 146"/>
    <path d="M139 98 Q 153 107 143 118"/>
    <path d="M142 124 Q 155 134 141 143"/>
